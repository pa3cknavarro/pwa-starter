<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Provinces – Sample Page</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
      --success: #22c55e; --danger: #ef4444; --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      margin: 0; padding: 1.5rem; line-height: 1.5;
    }
    h1, h2 { margin-top: 0; }
    a { color: var(--accent); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, select, button {
      font: inherit; padding: 0.5rem 0.75rem; border-radius: 8px;
      border: 1px solid var(--border); background: #0f172a; color: var(--text);
    }
    button {
      background: var(--accent); color: #0f172a; border: none;
      cursor: pointer; font-weight: 600;
    }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button.danger { background: var(--danger); color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .status { padding: 0.75rem; border-radius: 8px; margin-top: 0.75rem; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.85rem; }
    .status.ok { background: #14532d33; border: 1px solid var(--success); }
    .status.err { background: #7f1d1d33; border: 1px solid var(--danger); }
    .links { font-size: 0.8rem; }
    .links a { margin-right: 0.5rem; }
    nav { margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="provinces.html"><strong>Provinces</strong></a>
    <a href="cities.html">Cities</a>
  </nav>

  <h1>Provinces Sample Page</h1>
  <p class="muted">Demonstrates list (pagination + filter + sort), create, update, delete against the vertical-slice API.</p>

  <!-- List controls -->
  <div class="card">
    <h2>List Provinces</h2>
    <div class="row">
      <div>
        <label>Search</label>
        <input id="search" type="text" placeholder="e.g. Metro" />
      </div>
      <div>
        <label>Sort by</label>
        <select id="sortBy">
          <option value="name">Name</option>
          <option value="createdOn">Created On</option>
        </select>
      </div>
      <div>
        <label>Order</label>
        <select id="sortOrder">
          <option value="asc">Asc</option>
          <option value="desc">Desc</option>
        </select>
      </div>
      <div>
        <label>Page size</label>
        <select id="pageSize">
          <option>5</option>
          <option selected>10</option>
          <option>20</option>
        </select>
      </div>
      <button id="btnLoad">Load</button>
    </div>
    <div id="listStatus" class="status" style="display:none"></div>
    <div style="overflow-x:auto; margin-top:1rem">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Created By</th>
            <th>Created On</th>
            <th>Links (HATEOAS)</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:0.75rem">
      <button class="secondary" id="btnPrev" disabled>← Prev</button>
      <span id="pageInfo" class="muted"></span>
      <button class="secondary" id="btnNext" disabled>Next →</button>
    </div>
  </div>

  <!-- Create form -->
  <div class="card">
    <h2>Create Province</h2>
    <div class="row">
      <div>
        <label>Province Name *</label>
        <input id="createName" type="text" placeholder="e.g. Davao del Sur" />
      </div>
      <div>
        <label>Created By</label>
        <input id="createBy" type="text" placeholder="admin" value="demo-user" />
      </div>
      <button id="btnCreate">Create</button>
    </div>
    <div id="createStatus" class="status" style="display:none"></div>
  </div>

  <script src="api-client.js"></script>
  <script>
    let currentPage = 1;
    let totalPages = 1;

    function showStatus(el, ok, payload) {
      el.style.display = 'block';
      el.className = 'status ' + (ok ? 'ok' : 'err');
      el.textContent = typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2);
    }

    async function loadProvinces() {
      const search = document.getElementById('search').value.trim();
      const sortBy = document.getElementById('sortBy').value;
      const sortOrder = document.getElementById('sortOrder').value;
      const pageSize = document.getElementById('pageSize').value;

      const res = await ApiClient.get('/api/v1/provinces', {
        page: currentPage,
        pageSize,
        search,
        sortBy,
        sortOrder
      });

      const statusEl = document.getElementById('listStatus');
      if (!res.ok) {
        showStatus(statusEl, false, res.data || res.error);
        return;
      }
      statusEl.style.display = 'none';

      const data = res.data;
      totalPages = data.totalPages || 1;
      document.getElementById('pageInfo').textContent =
        `Page ${data.page} of ${totalPages} · ${data.totalCount} total`;

      document.getElementById('btnPrev').disabled = data.page <= 1;
      document.getElementById('btnNext').disabled = data.page >= totalPages;

      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      (data.items || []).forEach(p => {
        const tr = document.createElement('tr');
        const linksHtml = (p.links || [])
          .map(l => `<a href="${l.href}" target="_blank" title="${l.method}">${l.rel}</a>`)
          .join(' ');
        tr.innerHTML = `
          <td>${escapeHtml(p.provinceName)}</td>
          <td>${escapeHtml(p.createdBy)}</td>
          <td>${new Date(p.createdOn).toLocaleString()}</td>
          <td class="links">${linksHtml}</td>
          <td>
            <button class="secondary btn-edit" data-id="${p.provinceId}" data-name="${escapeHtml(p.provinceName)}">Edit</button>
            <button class="danger btn-del" data-id="${p.provinceId}">Delete</button>
          </td>`;
        tbody.appendChild(tr);
      });

      // Wire edit/delete buttons
      tbody.querySelectorAll('.btn-del').forEach(btn => {
        btn.addEventListener('click', () => deleteProvince(btn.dataset.id));
      });
      tbody.querySelectorAll('.btn-edit').forEach(btn => {
        btn.addEventListener('click', () => {
          const name = prompt('New province name:', btn.dataset.name);
          if (name) updateProvince(btn.dataset.id, name);
        });
      });
    }

    async function createProvince() {
      const name = document.getElementById('createName').value.trim();
      const createdBy = document.getElementById('createBy').value.trim() || 'demo-user';
      const statusEl = document.getElementById('createStatus');

      if (!name) {
        showStatus(statusEl, false, { title: 'Validation', detail: 'Province name is required' });
        return;
      }

      // Generate a unique Idempotency-Key for this create attempt
      const idemKey = crypto.randomUUID();
      const res = await ApiClient.post('/api/v1/provinces', {
        provinceName: name,
        createdBy
      }, idemKey);

      showStatus(statusEl, res.ok, res.data || res.error);
      if (res.ok) {
        document.getElementById('createName').value = '';
        currentPage = 1;
        await loadProvinces();
      }
    }

    async function updateProvince(id, name) {
      const res = await ApiClient.put(`/api/v1/provinces/${id}`, { provinceName: name });
      if (!res.ok) {
        alert('Update failed:\n' + JSON.stringify(res.data || res.error, null, 2));
        return;
      }
      await loadProvinces();
    }

    async function deleteProvince(id) {
      if (!confirm('Delete this province?')) return;
      const res = await ApiClient.delete(`/api/v1/provinces/${id}`);
      if (!res.ok && res.status !== 204) {
        alert('Delete failed:\n' + JSON.stringify(res.data || res.error, null, 2));
        return;
      }
      await loadProvinces();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Event wiring
    document.getElementById('btnLoad').addEventListener('click', () => { currentPage = 1; loadProvinces(); });
    document.getElementById('btnPrev').addEventListener('click', () => { currentPage--; loadProvinces(); });
    document.getElementById('btnNext').addEventListener('click', () => { currentPage++; loadProvinces(); });
    document.getElementById('btnCreate').addEventListener('click', createProvince);

    // Initial load
    loadProvinces();
  </script>
</body>
</html>
